<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashland Field (DEV)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--brand:#00A9D1;--brand-light:#e0f6fb;--brand-border:#b3e5f0;--grey:#4C4C4C;--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--green:#1E8449;--red:#c0392b}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.screen{display:none}.screen.active{display:block}
.brand{text-align:center;margin:24px 0}
.brand h1{font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.2em;color:var(--grey)}
.brand p{font-size:12px;color:var(--muted);margin-top:4px}
.bpick{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.bbtn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
.bbtn:active{background:#f0f9ff;border-color:var(--brand)}
.pinwrap{text-align:center;margin-top:20px}
.pindots{display:flex;justify-content:center;gap:16px;margin:24px 0}
.pindot{width:14px;height:14px;border-radius:50%;border:1.5px solid #8e8e93}
.pindot.filled{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:300px;margin:0 auto}
.key{background:#e9e9eb;border:none;border-radius:50%;width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin:0 auto;-webkit-tap-highlight-color:transparent;transition:background .08s}
.key:active{background:#c7c7cc}
.key.blank{background:transparent;cursor:default}
.key-num{font-family:'Instrument Sans',sans-serif;font-size:28px;font-weight:300;color:var(--ink);line-height:1}
.key-letters{font-family:'Instrument Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--ink);opacity:.55;margin-top:2px}
.pinerr{color:var(--red);font-size:13px;min-height:18px;margin-top:12px}
.back{background:none;border:none;color:var(--brand);font-size:14px;font-weight:600;cursor:pointer;padding:8px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar .who{font-size:13px;color:var(--muted)}
.topbar .who b{color:var(--ink);font-size:15px}
.signout{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.lotcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.lotcard:active{border-color:var(--brand)}
.lotcard .lh{display:flex;justify-content:space-between;align-items:flex-start}
.lotcard .num{font-size:18px;font-weight:700}
.lotcard .comm{font-size:13px;color:var(--muted);margin-top:2px}
.stagebadge{background:var(--brand-light);color:var(--brand);font-family:'DM Mono',monospace;font-weight:700;font-size:14px;padding:4px 10px;border-radius:8px}
.stagebadge.held{background:#fef4e6;color:var(--amber)}
.lotmeta{font-size:12px;color:var(--muted);margin-top:10px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px}
.sbar{background:var(--grey);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.sbar .r{display:flex;justify-content:space-between;align-items:center}
.sbar .num{font-size:18px;font-weight:700}
.sbar .stg{font-family:'DM Mono',monospace;font-weight:700;font-size:16px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:8px}
.sbar .stg.held{background:#7d5a2e}
.sbar .sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:6px}
.gatebar{background:#fff6ee;border:1px solid #f5d9b8;border-radius:12px;padding:12px;margin-bottom:12px}
.gatebar .gh{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--amber);margin-bottom:8px;letter-spacing:.05em}
.grow{display:flex;gap:8px}
.gbtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
.gbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ph{background:var(--grey);color:#fff;padding:9px 14px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:8px;margin-top:8px;cursor:pointer}
.ph .pc{font-weight:500;opacity:.6;font-size:11px}
.active-badge{background:var(--brand);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px}
.t{background:#fff;border:1px solid var(--line);border-top:none;padding:12px 14px}
.t.done{background:#f6fbf7}.t.started{background:#f5f9ff}
.t .th{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tname{font-size:14px;font-weight:600}
.tnum{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);background:var(--line);padding:1px 5px;border-radius:4px;margin-right:3px}
.tdate{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);margin-top:4px}
.tdate-edit{cursor:pointer;display:inline-block;color:var(--brand);text-decoration:underline;text-underline-offset:2px;text-decoration-style:dashed;border-radius:5px;padding:1px 5px;margin:-1px -5px;transition:background .1s}
.tdate-edit:active{background:var(--brand-light)}
.tacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ab{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase;padding:9px;border-radius:8px;border:none;cursor:pointer}
.ab.start{background:var(--brand);color:#fff;flex:1}.ab.fin{background:var(--green);color:#fff;flex:1}.ab.undo{background:#eef0f2;color:var(--muted);flex:1}
.critdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
.ticons{display:flex;gap:6px;font-size:18px;line-height:1}
.notei{font-size:18px}.flagi{font-size:16px}
.notect{font-size:11px;font-weight:700;color:var(--muted);vertical-align:super}
.ab.note{background:#f0f0f0;color:var(--grey);border:1px solid #d0d0d0;flex:0 0 auto;padding:9px 12px}
.ab.edit{background:var(--brand-light);color:var(--brand);border:1px solid var(--brand-border);flex:0 0 auto;padding:9px 12px}
.ab.conf{background:#f0f0f0;color:var(--muted);border:1px solid #d0d0d0;flex:0 0 auto;padding:9px 12px}
.ab.conf.confirmed{background:var(--brand-light);color:var(--brand);border-color:var(--brand-border)}
.flagbtn{font-family:inherit;font-size:13px;font-weight:600;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.flagbtn.sel{border-color:var(--brand);background:#e0f2fe;color:#0369a1}

/* ── Task edit modal ── */
.editmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end;justify-content:center}
.editmodal.open{display:flex}
.editbox{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.edit-section{margin-bottom:18px}
.edit-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.pred-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:26px}
.pred-chip{background:var(--brand-light);color:var(--brand);font-family:'DM Mono',monospace;font-size:12px;font-weight:700;padding:5px 9px;border-radius:6px;display:flex;align-items:center;gap:5px}
.chip-x{cursor:pointer;font-size:16px;font-weight:700;color:var(--brand);background:none;border:none;padding:0 1px;line-height:1}
.edit-pred-btn{width:100%;font-family:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:8px;border:1px solid var(--brand);color:var(--brand);background:var(--brand-light);cursor:pointer}
.edit-row{display:flex;gap:10px;margin-bottom:14px}
.edit-field{flex:1}
.edit-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.edit-field input,.edit-field select{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.edit-btns{display:flex;gap:8px;margin-top:18px}

/* ── Predecessor picker ── */
.predpicker{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;display:none;align-items:flex-end;justify-content:center}
.predpicker.open{display:flex}
.predbox{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column}
.predbox-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.predbox-head h3{font-size:15px;font-weight:700}
.pred-search{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.predlist{flex:1;overflow-y:auto;padding:4px 0}
.preditem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.preditem:active{background:#f0f9ff}
.preditem input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex-shrink:0;cursor:pointer}
.pi-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);min-width:32px}
.pi-name{font-size:13px;font-weight:500;line-height:1.3}
.predbox-foot{padding:14px 16px;border-top:1px solid var(--line);flex-shrink:0}

/* ── Stat cards (Items 5+6) ── */
.stat-cards{display:grid;gap:8px;margin-bottom:12px}
.stat-cards.cards-4{grid-template-columns:repeat(2,1fr)}
.stat-cards.cards-5{grid-template-columns:repeat(3,1fr)}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:center}
.stat-card .sc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.stat-card .sc-val{font-size:12px;font-weight:700;font-family:'DM Mono',monospace;color:var(--ink);line-height:1.3;word-break:break-word}
.stat-card .sc-val.behind{color:var(--red)}.stat-card .sc-val.ahead{color:var(--green)}

/* ── Close-ready banner (Item 5) ── */
.close-banner{background:var(--brand-light);border:1px solid var(--brand-border);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--brand)}

/* ── Closed lot / completion banners (Items 3+4) ── */
.arc-banner{border-radius:10px;padding:11px 14px;margin-bottom:12px;text-align:center;font-weight:700;font-size:13px;letter-spacing:.04em}
.arc-banner.closed{background:#f3f4f6;border:2px solid var(--grey);color:var(--grey)}
.arc-banner.done{background:#f0fdf4;border:1px solid #86efac;color:var(--green)}

/* ===== BULK PUSH ===== */
.bp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100000;display:flex;align-items:flex-end;justify-content:center}
.bp-modal{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 22px;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
@media(min-width:600px){.bp-overlay{align-items:center}.bp-modal{border-radius:16px}}
.bp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.bp-title{font-weight:700;font-size:16px;color:#2c3e50;line-height:1.25}
.bp-x{background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:0 4px}
.bp-subtitle{font-size:12px;color:#7f8c8d;margin-bottom:14px}
.bp-section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#95a5a6;margin:12px 0 6px}
.bp-select-row{display:flex;gap:8px;margin-bottom:8px}
.bp-selall{background:#ecf0f1;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#34495e}
.bp-lots{display:flex;flex-direction:column;gap:6px}
.bp-lot{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e4e8eb;border-radius:9px;cursor:pointer}
.bp-lot input{width:18px;height:18px;flex-shrink:0}
.bp-lotnum{font-weight:600;color:#2c3e50}
.bp-lotstage{margin-left:auto;font-size:12px;color:#95a5a6}
.bp-note-wrap{margin-top:14px;border-top:1px solid #eee;padding-top:12px}
.bp-note-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#34495e;cursor:pointer}
.bp-note-toggle input{width:16px;height:16px}
#bp-note-fields textarea{width:100%;margin-top:8px;min-height:64px;border:1px solid #dfe4e7;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:vertical;box-sizing:border-box}
.bp-flags{display:flex;gap:6px;margin-top:8px}
.bp-flag{border:1px solid #dfe4e7;background:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.bp-flag.on{border-color:#3498db;background:#eaf4fb;font-weight:600}
.bp-foot{display:flex;gap:10px;margin-top:18px}
.bp-cancel{flex:1;background:#ecf0f1;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:600;color:#7f8c8d;cursor:pointer}
.bp-next,.bp-apply{flex:2;background:#00A9D1;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.bp-apply{background:#27ae60}
.bp-apply:disabled{opacity:.6;cursor:default}
.bp-pv{background:#f8fafb;border:1px solid #e4e8eb;border-radius:9px;padding:12px;margin:8px 0}
.bp-pv-line{font-size:13px;color:#34495e;margin:3px 0}
.bp-pv-warn{font-size:12px;color:#c0392b;margin-top:8px;line-height:1.35}
.bp-pv-lots{font-size:13px;color:#2c3e50;font-weight:600;line-height:1.5}
/* task-row push button — matches .ab action buttons */
.ab.push{background:#eaf4fb;color:#2980b9;border:1px solid #d3e6f5}
/* whole-lot push button in schedule header */
.bp-lotbtn{display:inline-block;margin-left:8px;background:#eaf4fb;color:#2980b9;border:1px solid #d3e6f5;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;vertical-align:middle}
/* progress */
.bp-progbar{height:12px;background:#ecf0f1;border-radius:7px;overflow:hidden;margin:6px 0}
.bp-progfill{height:100%;background:#27ae60;border-radius:7px;transition:width .25s ease}
.bp-prog-detail{font-size:12px;color:#7f8c8d;min-height:16px;margin-top:4px}
.bp-prog-warn{font-size:12px;color:#95a5a6;margin-top:12px;text-align:center}

</style>
</head>
<body>
<div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.15em;padding:6px;pointer-events:none">⚠ DEVELOPMENT / UAT — NOT FOR BUILDER USE ⚠</div><div style="height:30px"></div>

<!-- Date picker modal -->
<div id="dpick" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:22px;width:300px;max-width:90vw">
    <div id="dpick-title" style="font-size:14px;font-weight:700;margin-bottom:14px"></div>
    <input type="date" id="dpick-input" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;text-align:center">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="dpick-cancel" style="font-family:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer">Cancel</button>
      <button id="dpick-ok" style="font-family:inherit;font-size:13px;font-weight:700;padding:10px 16px;border-radius:8px;border:none;background:var(--brand);color:#fff;cursor:pointer">OK</button>
    </div>
  </div>
</div>

<!-- Note thread modal -->
<div id="notemodal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:flex-end;justify-content:center">
  <div style="background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;height:94vh;overflow-y:auto;display:flex;flex-direction:column">
    <div id="note-title" style="font-size:15px;font-weight:700;margin-bottom:12px"></div>
    <div id="note-thread" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;flex:1"></div>
    <div style="border-top:1px solid var(--line);padding-top:14px">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Add a note</div>
      <textarea id="note-text" rows="8" style="width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:10px;resize:vertical" placeholder="Type or dictate…"></textarea>
      <button id="note-ai" onclick="aiCleanup()" style="width:100%;font-family:inherit;font-size:15px;font-weight:700;padding:11px;border-radius:10px;border:1px solid var(--brand-border);background:var(--brand-light);color:var(--brand);cursor:pointer;margin-top:10px">☁️ AI Cleanup</button>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="flagbtn" data-f="none" onclick="setNoteFlag('none')" style="flex:1">None</button>
        <button class="flagbtn" data-f="yellow" onclick="setNoteFlag('yellow')" style="flex:1">🟡 Remind</button>
        <button class="flagbtn" data-f="red" onclick="setNoteFlag('red')" style="flex:1">🔴 Mgmt</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="closeNote()" style="flex:1;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer">Done</button>
      <button onclick="addNote()" style="flex:2;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:10px;border:none;background:var(--brand);color:#fff;cursor:pointer">Add Note</button>
    </div>
  </div>
</div>

<!-- Task edit modal -->
<div id="editmodal" class="editmodal">
  <div class="editbox">
    <div id="edit-title" style="font-size:15px;font-weight:700;margin-bottom:18px"></div>

    <div class="edit-section">
      <div class="edit-label">Current Predecessors</div>
      <div class="pred-chips" id="edit-pred-chips"></div>
      <button class="edit-pred-btn" onclick="openPredPicker()">⟳ Change Predecessors</button>
    </div>

    <div class="edit-row">
      <div class="edit-field">
        <label>Duration (days)</label>
        <input type="number" id="edit-dur" min="1" max="99">
      </div>
      <div class="edit-field">
        <label>Lag (days)</label>
        <input type="number" id="edit-lag" min="-99" max="99">
      </div>
    </div>

    <div class="edit-field" style="margin-bottom:6px">
      <label>Phase</label>
      <select id="edit-phase"></select>
    </div>

    <div class="edit-field" style="margin-bottom:6px">
      <label>Est. Start Date <span style="font-weight:400;color:var(--muted)">(optional override)</span></label>
      <input type="date" id="edit-est-start" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:'DM Mono',monospace;font-size:15px;text-align:center;outline:none;box-sizing:border-box">
      <button onclick="clearEstStart()" style="margin-top:6px;font-family:inherit;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0">Clear (use calculated date)</button>
    </div>

    <div class="edit-btns">
      <button onclick="closeEditTask()" style="flex:1;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer">Cancel</button>
      <button id="edit-save-btn" onclick="saveEditTask()" style="flex:2;font-family:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:10px;border:none;background:var(--brand);color:#fff;cursor:pointer">Save Changes</button>
    </div>
  </div>
</div>

<!-- Predecessor picker modal -->
<div id="predpicker" class="predpicker">
  <div class="predbox">
    <div class="predbox-head">
      <h3>Select Predecessors</h3>
      <input class="pred-search" id="pred-search" type="text" placeholder="Search by number or name…" oninput="filterPredList()">
    </div>
    <div class="predlist" id="predlist"></div>
    <div class="predbox-foot">
      <button onclick="closePredPicker()" style="width:100%;font-family:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:10px;border:none;background:var(--brand);color:#fff;cursor:pointer">Done</button>
    </div>
  </div>
</div>

<div class="wrap">

<script>
const SUPABASE_FN='/.netlify/functions/supabase';
let API_SECRET=null;
async function loadSecret(){if(API_SECRET)return API_SECRET;const r=await fetch('/.netlify/functions/config');const d=await r.json();API_SECRET=d.secret;return API_SECRET;}
async function sbCall(action,payload){await loadSecret();const r=await fetch(SUPABASE_FN,{method:'POST',headers:{'Content-Type':'application/json','X-Api-Secret':API_SECRET},body:JSON.stringify({action,payload})});const d=await r.json();if(d&&d.error){alert('Error: '+d.error);return null;}return d;}

let currentBuilder=null, pinEntry='', myLots=[];
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

async function loadBuilders(){
  const bs=await sbCall('getBuilders',{})||[];
  const list=bs.filter(b=>!b.is_admin);
  const el=document.getElementById('builder-list');
  if(!list.length){el.innerHTML='<div class="empty">No builders found.</div>';return;}
  el.innerHTML=list.map(b=>'<button class="bbtn" onclick="pickBuilder(\''+b.name.replace(/'/g,"\\'")+'\')">'+b.name+'</button>').join('');
}
function pickBuilder(name){currentBuilder=name;pinEntry='';document.getElementById('pin-name').textContent=name;document.getElementById('pinerr').textContent='';renderPin();showScreen('screen-pin');}
function toBuilders(){currentBuilder=null;pinEntry='';showScreen('screen-builders');}

const KEY_LETTERS={'2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ','0':'+'};
function keyHtml(k){
  if(k==='')return '<div class="key blank"></div>';
  if(k==='⌫')return '<button class="key" onclick="pinKey(\'⌫\')"><span class="key-num" style="font-size:22px;font-weight:400">⌫</span></button>';
  const letters=KEY_LETTERS[k]||'';
  return '<button class="key" onclick="pinKey(\''+k+'\')"><span class="key-num">'+k+'</span>'+(letters?'<span class="key-letters">'+letters+'</span>':'')+'</button>';
}
function renderPin(){
  let dots='';for(let i=0;i<4;i++)dots+='<div class="pindot'+(i<pinEntry.length?' filled':'')+'"></div>';
  document.getElementById('pindots').innerHTML=dots;
  document.getElementById('keys').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(keyHtml).join('');
}
async function pinKey(k){
  if(k==='⌫'){pinEntry=pinEntry.slice(0,-1);renderPin();return;}
  if(pinEntry.length>=4)return;
  pinEntry+=k;renderPin();
  if(pinEntry.length===4){await tryPin();}
}
async function tryPin(){
  const res=await sbCall('verifyPin',{name:currentBuilder,pin:pinEntry});
  if(res&&res.valid){
    if(res.is_temp){startSetPin();return;}
    enterApp();
  } else if(res&&res.locked){
    document.getElementById('pinerr').textContent='🔒 Locked — too many attempts. Contact your admin to unlock.';
    pinEntry='';renderPin();
  } else {
    const left=(res&&typeof res.attemptsLeft==='number')?res.attemptsLeft:null;
    const msg=(left!==null)?('Incorrect PIN — '+left+' attempt'+(left===1?'':'s')+' left'):'Incorrect PIN';
    document.getElementById('pinerr').textContent=msg;pinEntry='';
    setTimeout(()=>{document.getElementById('pinerr').textContent='';renderPin();},1100);
  }
}

// ---- forced PIN change ----
let setPinEntry='',setPinConfirm='',setPinStage='new';
function startSetPin(){setPinEntry='';setPinConfirm='';setPinStage='new';showScreen('screen-setpin');renderSetPin();}
function renderSetPin(){
  const entry=setPinStage==='new'?setPinEntry:setPinConfirm;
  document.getElementById('setpin-heading').textContent=setPinStage==='new'?'Create your PIN':'Confirm your PIN';
  document.getElementById('setpin-sub').textContent=setPinStage==='new'?'Choose a new 4-digit PIN':'Enter it again to confirm';
  let dots='';for(let i=0;i<4;i++)dots+='<div class="pindot'+(i<entry.length?' filled':'')+'"></div>';
  document.getElementById('setpin-dots').innerHTML=dots;
  document.getElementById('setpin-keys').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>{
    if(k==='')return '<div class="key blank"></div>';
    if(k==='⌫')return '<button class="key" onclick="setPinKey(\'⌫\')"><span class="key-num" style="font-size:22px;font-weight:400">⌫</span></button>';
    const letters=KEY_LETTERS[k]||'';
    return '<button class="key" onclick="setPinKey(\''+k+'\')"><span class="key-num">'+k+'</span>'+(letters?'<span class="key-letters">'+letters+'</span>':'')+'</button>';
  }).join('');
}
async function setPinKey(k){
  const err=document.getElementById('setpin-err');err.textContent='';
  if(setPinStage==='new'){
    if(k==='⌫'){setPinEntry=setPinEntry.slice(0,-1);renderSetPin();return;}
    if(setPinEntry.length>=4)return;
    setPinEntry+=k;renderSetPin();
    if(setPinEntry.length===4){setPinStage='confirm';setTimeout(renderSetPin,150);}
  } else {
    if(k==='⌫'){setPinConfirm=setPinConfirm.slice(0,-1);renderSetPin();return;}
    if(setPinConfirm.length>=4)return;
    setPinConfirm+=k;renderSetPin();
    if(setPinConfirm.length===4){
      if(setPinConfirm!==setPinEntry){err.textContent='PINs don’t match — try again';setPinEntry='';setPinConfirm='';setPinStage='new';setTimeout(renderSetPin,900);return;}
      const r=await sbCall('setBuilderPin',{name:currentBuilder,pin:setPinEntry});
      if(r&&r.success){enterApp();}
      else{err.textContent='Could not save PIN — try again';setPinEntry='';setPinConfirm='';setPinStage='new';setTimeout(renderSetPin,900);}
    }
  }
}

const SUB_NAMES={RC:'Ruby Creek',CO:'Chimney Oaks',TB:'Traditions of Braselton',CT:'Clocktower',TE:'Thurgood Estates',CW:'Carrington Walk'};
let curSub=null;

function enterApp(){document.getElementById('subs-who').textContent=currentBuilder;showScreen('screen-subs');loadMyLots();}
function signOut(){currentBuilder=null;pinEntry='';curSub=null;myLots=[];showScreen('screen-builders');}
async function refreshView(){
  const active=document.querySelector('.screen.active');if(!active)return;
  const id=active.id;
  if(id==='screen-subs'||id==='screen-lots'){await loadMyLots();}
  else if(id==='screen-schedule'&&curLot){await openLot(curLot.id);}
}

async function loadMyLots(){
  document.getElementById('subs-list').innerHTML='<div class="loading">Loading your lots…</div>';
  const all=await sbCall('getScheduleLots',{})||[];
  myLots=all.filter(l=>l.builder_name===currentBuilder&&l.reported_stage&&parseFloat(l.reported_stage)>=1.1);
  renderSubs();
}

function renderSubs(){
  const el=document.getElementById('subs-list');
  if(!myLots.length){el.innerHTML='<div class="empty">No released lots assigned to you yet.</div>';return;}
  const groups={};
  myLots.forEach(l=>{const c=l.community||'—';(groups[c]=groups[c]||[]).push(l);});
  const codes=Object.keys(groups).sort();
  if(codes.length===1){openSub(codes[0],true);return;}
  el.innerHTML=codes.map(c=>{
    const n=groups[c].length;const name=SUB_NAMES[c]||c;
    return '<div class="lotcard" onclick="openSub(\''+c+'\')">'
      +'<div class="lh"><div><div class="num">'+name+'</div><div class="comm">'+c+'</div></div>'
      +'<span class="stagebadge">'+n+' lot'+(n!==1?'s':'')+'</span></div></div>';
  }).join('');
}

function openSub(code,skipBack){curSub=code;document.getElementById('lots-subname').textContent=(SUB_NAMES[code]||code);showScreen('screen-lots');renderLots();}
function backToSubs(){const communities=new Set(myLots.map(l=>l.community||'—'));if(communities.size<=1){showScreen('screen-subs');loadMyLots();return;}curSub=null;showScreen('screen-subs');renderSubs();}

function renderLots(){
  const el=document.getElementById('lots-list');
  const lots=myLots.filter(l=>(l.community||'—')===curSub).sort((a,b)=>a.lot_number.localeCompare(b.lot_number,undefined,{numeric:true}));
  if(!lots.length){el.innerHTML='<div class="empty">No lots here.</div>';return;}
  el.innerHTML=lots.map(l=>{
    const held=(l.reported_stage==='5.9'&&l.true_stage&&l.true_stage!=='5.9');
    return '<div class="lotcard" onclick="openLot(\''+l.id+'\')">'
      +'<div class="lh"><div><div class="num">'+l.lot_number+'</div>'+(l.community?'<div class="comm">'+l.community+'</div>':'')+'</div>'
      +'<span class="stagebadge'+(held?' held':'')+'">'+l.reported_stage+'</span></div>'
      +'<div class="lotmeta">'+(l.construction_start_date?'Start: '+l.construction_start_date:'No start date set')+(held?' · ⚡ held at 5.9':'')+'</div>'
      +'</div>';
  }).join('');
}
function backToLots(){showScreen('screen-lots');renderLots();}

// ============ SCHEDULE ENGINE ============
let TASKS=[],bn={},act={},startDate=null;
let collapsedPhases={},userToggledPhases=false;
let curLot=null,stageMap=[],lotGates=[],curManual=null;

function addWD(start,off){let d=new Date(start);d.setHours(0,0,0,0);let c=1;while(c<off){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)c++;}return d;}
function wdBetween(a,b){let d1=new Date(a),d2=new Date(b);d1.setHours(0,0,0,0);d2.setHours(0,0,0,0);if(d1.getTime()===d2.getTime())return 0;const sign=d2>d1?1:-1;let cur=new Date(d1),c=0;while(cur.getTime()!==d2.getTime()){cur.setDate(cur.getDate()+sign);const w=cur.getDay();if(w!==0&&w!==6)c+=sign;}return c;}
function fmt(d){return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function ymd(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function isValidDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00').getTime());}
function todayYmd(){return ymd(new Date());}
function actOffset(iso){if(!startDate||!iso)return null;return wdBetween(startDate,new Date(iso+'T00:00:00'))+1;}
function offToDate(off){if(off>=1)return addWD(startDate,off);let d=new Date(startDate);d.setHours(0,0,0,0);let c=1;while(c>off){d.setDate(d.getDate()-1);const w=d.getDay();if(w!==0&&w!==6)c--;}return d;}

function runEngine(mode){
  // If predecessor data exists in DB: full recursive CPM engine
  const hasPreds=TASKS.some(t=>t.preds&&t.preds.length>0);
  if(hasPreds){
    const memo={};
    function ef(n,stk){
      if(memo[n]!==undefined)return memo[n];
      const t=bn[n];if(stk.includes(n))return t.rf||1;
      let pd=null;
      (t.preds||[]).forEach(p=>{if(bn[p]){const pe=ef(p,[...stk,n]);pd=(pd===null)?pe+1:Math.max(pd,pe+1);}});
      let es;const a=act[n]||{};
      const aStartOff=(mode==='projected'&&a.started&&a.start)?actOffset(a.start):null;
      const ps=(pd!==null)?pd+t.lag:null;
      if(aStartOff!==null){es=aStartOff;}
      else{
        es=ps!==null?ps:(t.rs||1);
        if(mode==='projected'&&!a.started&&t.est_start_date){const estOff=actOffset(t.est_start_date);if(estOff!==null)es=Math.max(es,estOff);}
      }
      let e;const aFinOff=(mode==='projected'&&a.finished&&a.finish)?actOffset(a.finish):null;
      if(aFinOff!==null){e=aFinOff;}else{e=es+t.dur-1;}
      memo[n]=e;t['_'+mode+'_es']=es;t['_'+mode+'_ef']=e;return e;
    }
    TASKS.forEach(t=>ef(t.num,[]));
    const end=Math.max(...TASKS.map(t=>t['_'+mode+'_ef']));
    if(mode==='planned'){
      const succ={};TASKS.forEach(t=>succ[t.num]=[]);
      TASKS.forEach(t=>(t.preds||[]).forEach(p=>{if(succ[p])succ[p].push(t.num)}));
      const lf={};
      function latef(n,stk){if(lf[n]!==undefined)return lf[n];if(stk.includes(n))return end;const ss=succ[n];let v=ss.length===0?end:Math.min(...ss.map(s=>latef(s,[...stk,n])-bn[s].dur+1-1-bn[s].lag));lf[n]=v;return v;}
      TASKS.forEach(t=>{t._lf=latef(t.num,[]);t._ls=t._lf-t.dur+1;t._tf=t._ls-t._planned_es;t._crit=(t._tf<=0)});
    }
    return end;
  }
  // No predecessor data in DB: sequential slip-propagation engine.
  // Processes tasks in relative_start order, accumulating the maximum schedule slip
  // seen so far and applying it to all subsequent tasks. This correctly cascades
  // delays through the schedule without requiring predecessor relationships.
  const sorted=[...TASKS].sort((a,b)=>(a.rs||1)-(b.rs||1)||(a.order||0)-(b.order||0));
  let maxSlip=0;
  if(mode==='projected'){
    sorted.forEach(t=>{
      const a=act[t.num]||{};
      const aStartOff=(a.started&&a.start)?actOffset(a.start):null;
      const aFinOff=(a.finished&&a.finish)?actOffset(a.finish):null;
      const estOff=(!a.started&&t.est_start_date)?actOffset(t.est_start_date):null;
      // How many WD is this task displaced from its planned position?
      let slip=0;
      if(aFinOff!==null){slip=aFinOff-((t.rs||1)+t.dur-1);}
      else if(aStartOff!==null){slip=aStartOff-(t.rs||1);}
      else if(estOff!==null){slip=Math.max(0,estOff-(t.rs||1));}
      maxSlip=Math.max(maxSlip,slip);
      const es=(t.rs||1)+maxSlip;
      t['_projected_es']=es;t['_projected_ef']=aFinOff!==null?aFinOff:es+t.dur-1;
    });
  }else{
    sorted.forEach(t=>{t['_planned_es']=t.rs||1;t['_planned_ef']=(t.rs||1)+t.dur-1;});
  }
  const end=Math.max(...TASKS.map(t=>t['_'+mode+'_ef']));
  if(mode==='planned'){
    // Float relative to end; use is_crit from DB to mark actual critical path tasks
    TASKS.forEach(t=>{t._lf=end;t._ls=t._lf-t.dur+1;t._tf=t._ls-(t._planned_es||t.rs||1);t._crit=(t._tf<=0)||!!t.is_crit;});
  }
  return end;
}
function recompute(){const p=runEngine('planned');const pr=runEngine('projected');return{planEnd:p,projEnd:pr};}

function computeStage(){
  const achieved=stageMap.filter(s=>!s.is_manual&&s.triggers&&s.triggers.length&&s.triggers.every(bt=>act[bt]&&act[bt].finished));
  let trueStage=null;
  achieved.forEach(s=>{if(!trueStage||s.order>trueStage.order)trueStage=s;});
  if(!trueStage&&curManual){trueStage=stageMap.find(s=>s.code===curManual)||{code:curManual,label:'Pre-construction',order:0};}
  const gatesOpen=lotGates.some(g=>!g.confirmed);
  let held=false,reportedCode,reportedLabel;
  if(trueStage&&gatesOpen&&parseFloat(trueStage.code)>5.9){held=true;reportedCode='5.9';reportedLabel='Utility Hold';}
  else{reportedCode=trueStage?trueStage.code:'—';reportedLabel=trueStage?trueStage.label:'Pre-construction';}
  return{reportedCode,reportedLabel,held,trueCode:trueStage?trueStage.code:null,trueLabel:trueStage?trueStage.label:null,gatesOpen};
}

function openDatePicker(title,defaultDate){
  return new Promise(resolve=>{
    const ov=document.getElementById('dpick');
    document.getElementById('dpick-title').textContent=title;
    document.getElementById('dpick-input').value=defaultDate||todayYmd();
    ov.style.display='flex';
    const ok=document.getElementById('dpick-ok'),cancel=document.getElementById('dpick-cancel');
    function done(v){ov.style.display='none';ok.onclick=null;cancel.onclick=null;resolve(v);}
    ok.onclick=()=>{const v=document.getElementById('dpick-input').value;done(v||null);};
    cancel.onclick=()=>done(null);
  });
}

async function openLot(id){
  curLot=myLots.find(l=>l.id===id);
  if(!curLot)return;
  showScreen('screen-schedule');
  document.getElementById('sched-view').innerHTML='<div class="loading">Loading schedule…</div>';
  const data=await sbCall('getScheduleLotTasks',{lot_id:id});
  if(!data){return;}
  const rows=data.tasks||[];
  lotGates=data.gates||[];
  curManual=curLot.manual_stage||null;
  TASKS=rows.map(r=>({_id:r.id,num:r.bt_num,name:r.name,rs:r.relative_start,dur:r.duration,lag:r.lag,rf:r.relative_finish,preds:r.predecessors||[],phase:r.phase_order,phase_name:r.phase_name,type:r.task_type,order:r.task_order,note:r.note||'',flag:r.flag||'none',est_start_date:r.est_start_date||null,is_crit:!!r.is_critical}));
  bn={};TASKS.forEach(t=>bn[t.num]=t);
  act={};rows.forEach(r=>{act[r.bt_num]={started:(r.status==='started'||r.status==='finished'),finished:(r.status==='finished'),start:r.actual_start,finish:r.actual_finish,vendor_confirmed:!!r.vendor_confirmed};});
  startDate=curLot.construction_start_date?new Date(curLot.construction_start_date+'T00:00:00'):new Date();
  if(curLot.template_id){const sm=await sbCall('getTemplateStageMap',{template_id:curLot.template_id});stageMap=(sm&&sm.stages)||[];}else{stageMap=[];}
  lotNotes=await sbCall('getTaskNotes',{lot_id:id})||[];
  userToggledPhases=false;collapsedPhases={};
  renderSchedule();
}

function renderSchedule(){
  const {planEnd,projEnd}=recompute();
  const st=computeStage();
  const projEndDate=offToDate(projEnd);
  const today=new Date();today.setHours(0,0,0,0);
  const todayOff=wdBetween(startDate,today)+1;
  const wdLeft=Math.max(0,projEnd-todayOff);
  const weeksLeft=(wdLeft/5).toFixed(1);
  const isClosed=(curLot.status==='closed');
  const isStamped=!!curLot.completion_stamped_at;
  // Health delta: positive = ahead, negative = behind. Freeze at stamp if all done.
  const healthDelta=isStamped?(curLot.completion_health_delta||0):(planEnd-projEnd);
  const stageNum=parseFloat(st.reportedCode)||0;

  // ── Header bar ──
  let h='<div class="sbar"><div class="r"><div class="num">'+curLot.lot_number
    +(isClosed?' <span style="font-size:11px;background:rgba(255,255,255,.25);padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.07em">CLOSED</span>':'')
    +'</div><div class="stg'+(st.held?' held':'')+'">'+st.reportedCode+'</div></div>'
    +'<div class="sub">'+(st.held?'⚡ Held at 5.9 — actually '+st.trueCode:st.reportedLabel)+' · finish '+fmt(projEndDate)+'</div></div>';
  h+='<div style="padding:0 2px 10px"><button class="bp-lotbtn" onclick="openBulkPushLot()">⧉ Push entire lot status →</button></div>';

  // ── Stat cards (Items 5+6) ──
  const hdCls=healthDelta>0?'ahead':(healthDelta<0?'behind':'');
  const hdTxt=healthDelta>0?('+'+healthDelta+'d ahead'):(healthDelta<0?(Math.abs(healthDelta)+'d behind'):'On track');
  const startFmt=curLot.construction_start_date?fmt(new Date(curLot.construction_start_date+'T00:00:00')):'—';
  const cardCount=curLot.scheduled_close_date?5:4;
  h+='<div class="stat-cards cards-'+cardCount+'">'
    +'<div class="stat-card"><div class="sc-label">Start</div><div class="sc-val">'+startFmt+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Completion</div><div class="sc-val">'+fmt(projEndDate)+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Wks Out</div><div class="sc-val">'+(wdLeft<=0?'Done':weeksLeft+' wk')+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Health</div><div class="sc-val '+hdCls+'">'+hdTxt+(isStamped?' 🔒':'')+'</div></div>';
  if(curLot.scheduled_close_date){
    h+='<div class="stat-card"><div class="sc-label">Sched Close</div><div class="sc-val">'+fmt(new Date(curLot.scheduled_close_date+'T00:00:00'))+'</div></div>';
  }
  h+='</div>';

  // ── Item 3: Closed lot banner ──
  if(isClosed){h+='<div class="arc-banner closed">🔒 LOT CLOSED — Schedule archived</div>';}

  // ── Item 4: Completion stamp banner ──
  if(isStamped&&!isClosed){
    const elapsed=curLot.completion_wd_elapsed!=null?' — '+curLot.completion_wd_elapsed+' working days':'';
    h+='<div class="arc-banner done">✅ All tasks complete'+elapsed+'</div>';
  }

  // ── Item 5: Stage 6.0 close-ready banner ──
  if(!isClosed&&stageNum>=6.0){
    const closeNote=curLot.scheduled_close_date?' · Closing: '+fmt(new Date(curLot.scheduled_close_date+'T00:00:00')):'';
    h+='<div class="close-banner">🏠 Ready to schedule closing'+closeNote+'</div>';
  }

  if(lotGates.length){
    const anyOpen=lotGates.some(g=>!g.confirmed);
    h+='<div class="gatebar"><div class="gh">'+(anyOpen?'Utilities — confirm when installed':'✓ All utilities confirmed')+'</div><div class="grow">';
    lotGates.forEach(g=>{h+='<button class="gbtn'+(g.confirmed?' on':'')+'" data-gid="'+g.id+'" data-cf="'+(g.confirmed?1:0)+'">'+g.gate_name+(g.confirmed?' ✓':'')+'</button>';});
    h+='</div></div>';
  }
  h+='<div id="sched"></div>';
  document.getElementById('sched-view').innerHTML=h;
  document.querySelectorAll('.gbtn').forEach(b=>{b.onclick=()=>toggleGate(b.dataset.gid,b.dataset.cf==='1');});
  renderTasks();
}

function renderTasks(){
  const canEdit=(currentBuilder===curLot.builder_name);
  let h='';
  const phaseOrder=[];const seen={};
  TASKS.forEach(t=>{if(!seen[t.phase]){seen[t.phase]=true;phaseOrder.push(t.phase);}});
  phaseOrder.sort((a,b)=>a-b);
  const phaseName={};TASKS.forEach(t=>phaseName[t.phase]=t.phase_name);
  let activePhase=null,earliest=Infinity;
  TASKS.forEach(t=>{if(!(act[t.num]&&act[t.num].finished)&&t._projected_es<earliest){earliest=t._projected_es;activePhase=t.phase;}});
  if(!userToggledPhases){phaseOrder.forEach(ph=>{collapsedPhases[ph]=(ph!==activePhase);});}
  phaseOrder.forEach(ph=>{
    const inPhase=TASKS.filter(t=>t.phase===ph);
    if(!inPhase.length)return;
    // sort by projected early start, then task order as tiebreak
    inPhase.sort((a,b)=>(a._projected_es-b._projected_es)||(a.order-b.order)||(a.num-b.num));
    const collapsed=collapsedPhases[ph];
    const doneCt=inPhase.filter(t=>act[t.num]&&act[t.num].finished).length;
    const caret=collapsed?'▸':'▾';
    const activeTag=(ph===activePhase)?'<span class="active-badge">active</span>':'';
    h+='<div class="ph" data-ph="'+ph+'"><span>'+caret+' '+(phaseName[ph]||('Phase '+ph))+' '+activeTag+'</span><span class="pc">'+doneCt+'/'+inPhase.length+'</span></div>';
    if(collapsed)return;
    inPhase.forEach(t=>{
      const a=act[t.num]||{};
      const cls=a.finished?'done':(a.started?'started':'');
      const ps=offToDate(t._projected_es),pf=offToDate(t._projected_ef);
      let acts='';
      if(a.finished){
        acts='<button class="ab undo" data-a="undo" data-n="'+t.num+'">Undo</button>';
      } else if(a.started){
        acts='<button class="ab fin" data-a="finish" data-n="'+t.num+'">Finish</button>'
            +'<button class="ab undo" data-a="undo" data-n="'+t.num+'">Undo</button>';
      } else {
        acts='<button class="ab start" data-a="start" data-n="'+t.num+'">Start</button>';
      }
      acts+='<button class="ab conf'+(a.vendor_confirmed?' confirmed':'')+'" data-a="conf" data-n="'+t.num+'">'+(a.vendor_confirmed?'✓ Conf':'Confirm')+'</button>';
      acts+='<button class="ab note" data-a="note" data-n="'+t.num+'">✎ Note</button>';acts+='<button class="ab push" data-a="push" data-n="'+t.num+'">⧉ Push</button>';
      if(canEdit){acts+='<button class="ab edit" data-a="edit" data-n="'+t.num+'">⚙ Edit</button>';}
      const tNotes=notesForTask(t.num);
      const anyRed=tNotes.some(x=>x.flag==='red'),anyYellow=tNotes.some(x=>x.flag==='yellow');
      const flagIcon=anyRed?'<span class="flagi">🔴</span>':(anyYellow?'<span class="flagi">🟡</span>':'');
      const noteIcon=tNotes.length?'<span class="notei">📝<span class="notect">'+tNotes.length+'</span></span>':'';
      const dispStart=(!a.started&&t.est_start_date)?new Date(t.est_start_date+'T00:00:00'):ps;
      const startLabel=(!a.started&&!a.finished)
        ?fmt(dispStart)+' → '+fmt(pf)
        :(a.started?fmt(ps)+' → '+(a.finish?fmt(new Date(a.finish+'T00:00:00')):'…'):fmt(dispStart)+' → '+fmt(pf));
      h+='<div class="t '+cls+'">'
        +'<div class="th"><div class="tname"><span class="tnum">#'+t.num+'</span>'+t.name+(t._crit?'<span class="critdot"></span>':'')+'</div>'
        +'<div class="ticons">'+flagIcon+noteIcon+'</div></div>'
        +'<div class="tdate">'+startLabel+'</div>'
        +'<div class="tacts">'+acts+'</div></div>';
    });
  });
  document.getElementById('sched').innerHTML=h;
  document.querySelectorAll('.ph').forEach(el=>{el.onclick=()=>{const p=+el.dataset.ph;userToggledPhases=true;collapsedPhases[p]=!collapsedPhases[p];renderTasks();};});
  document.querySelectorAll('.ab').forEach(b=>{
    b.onclick=()=>{
      const n=+b.dataset.n,a=b.dataset.a;
      if(a==='start')startTask(n);
      else if(a==='finish')finishTask(n);
      else if(a==='undo')undoTask(n);
      else if(a==='note')openNote(n);
      else if(a==='edit')openEditTask(n);
      else if(a==='conf')toggleConfirm(n);
      else if(a==='push')openBulkPushTask(n);
    };
  });
}

async function saveTask(t){
  const a=act[t.num];
  await sbCall('updateScheduleLotTask',{task_id:t._id,lot_id:curLot.id,status:(a.finished?'finished':(a.started?'started':'not_started')),actual_start:a.start||null,actual_finish:a.finish||null});
  await saveStage();
  await checkCompletionStamp(); // Item 4
}
async function saveStage(){
  const st=computeStage();
  await sbCall('updateScheduleLot',{id:curLot.id,reported_stage:(st.reportedCode==='—'?null:st.reportedCode),true_stage:st.trueCode||null});
}
async function toggleConfirm(n){
  const t=bn[n];
  const a=act[n]||{};
  act[n]={...a,vendor_confirmed:!a.vendor_confirmed};
  renderTasks();
  await sbCall('updateScheduleLotTask',{task_id:t._id,lot_id:curLot.id,vendor_confirmed:act[n].vendor_confirmed});
}

async function startTask(n){
  const t=bn[n];
  const defaultDate=t.est_start_date||todayYmd();
  const v=await openDatePicker('Start — #'+n+' '+t.name,defaultDate);
  if(v===null)return;if(!isValidDate(v)){alert('Invalid date.');return;}
  act[n]={started:true,finished:false,start:v,finish:null};renderSchedule();await saveTask(t);
}
async function finishTask(n){
  const t=bn[n];
  // ── Item 2: Soft predecessor warning ──
  const incompletePreds=(t.preds||[]).filter(p=>bn[p]&&!(act[p]&&act[p].finished));
  if(incompletePreds.length){
    const names=incompletePreds.map(p=>'#'+p+(bn[p]?' — '+bn[p].name:'')).join('\n');
    const ok=confirm('⚠️ Unfinished predecessors:\n\n'+names+'\n\nFinishing now may affect schedule accuracy. If these tasks are no longer required first, remove them in ⚙ Edit.\n\nFinish anyway?');
    if(!ok)return;
  }
  const v=await openDatePicker('Finish — #'+n+' '+t.name,todayYmd());
  if(v===null)return;if(!isValidDate(v)){alert('Invalid date.');return;}
  const a=act[n]||{};act[n]={started:true,finished:true,start:a.start||v,finish:v};renderSchedule();await saveTask(t);
}
async function undoTask(n){
  const t=bn[n];act[n]={started:false,finished:false,start:null,finish:null};renderSchedule();await saveTask(t);
}

// ── Item 4: Completion stamp ──
async function checkCompletionStamp(){
  if(curLot.completion_stamped_at)return; // already stamped — don't overwrite
  const allDone=TASKS.length>0&&TASKS.every(t=>act[t.num]&&act[t.num].finished);
  if(!allDone)return;
  const today=new Date();today.setHours(0,0,0,0);
  const wdElapsed=wdBetween(startDate,today);
  const {planEnd,projEnd}=recompute();
  const healthDelta=planEnd-projEnd;
  const stamped=new Date().toISOString();
  await sbCall('stampLotComplete',{id:curLot.id,completion_stamped_at:stamped,completion_wd_elapsed:wdElapsed,completion_health_delta:healthDelta});
  curLot.completion_stamped_at=stamped;
  curLot.completion_wd_elapsed=wdElapsed;
  curLot.completion_health_delta=healthDelta;
  renderSchedule();
}
async function toggleGate(gateId,currentlyConfirmed){
  const g=lotGates.find(x=>x.id===gateId);if(!g)return;
  g.confirmed=!currentlyConfirmed;renderSchedule();
  await sbCall('updateScheduleLotGate',{gate_id:gateId,confirmed:g.confirmed});
  await saveStage();
}

let editTaskNum=null, editPreds=[];

function openEditTask(n){
  editTaskNum=n;
  const t=bn[n];
  editPreds=[...(t.preds||[])];

  document.getElementById('edit-title').textContent='Edit Task #'+n+' — '+t.name;

function clearEstStart(){document.getElementById('edit-est-start').value='';}

function closeEditTask(){
  document.getElementById('editmodal').classList.remove('open');
  editTaskNum=null;
  editPreds=[];
}

function renderEditPredChips(){
  const el=document.getElementById('edit-pred-chips');
  if(!editPreds.length){
    el.innerHTML='<span style="font-size:13px;color:var(--muted)">None</span>';
    return;
  }
  el.innerHTML=editPreds.map(p=>{
    const pt=bn[p];
    const label=pt?'#'+p+' '+pt.name:'#'+p;
    return '<div class="pred-chip">'+escapeHtml(label)
      +'<button class="chip-x" onclick="removePred('+p+')">×</button></div>';

}

function removePred(n){
  editPreds=editPreds.filter(p=>p!==n);
  renderEditPredChips();
}

function openPredPicker(){
  document.getElementById('pred-search').value='';
  renderPredList('');
  document.getElementById('predpicker').classList.add('open');
}

function closePredPicker(){
  document.getElementById('predpicker').classList.remove('open');
  renderEditPredChips();
}

function renderPredList(filter){
  const f=filter.toLowerCase();
  const tasks=TASKS
    .filter(t=>t.num!==editTaskNum)
    .filter(t=>!f||('#'+t.num+' '+t.name).toLowerCase().includes(f))
    .sort((a,b)=>a.num-b.num);
  document.getElementById('predlist').innerHTML=tasks.map(t=>{
    const checked=editPreds.includes(t.num);
    return '<label class="preditem">'
      +'<input type="checkbox"'+(checked?' checked':'')
      +' onchange="togglePred('+t.num+',this.checked)">'
      +'<span class="pi-num">#'+t.num+'</span>'
      +'<span class="pi-name">'+escapeHtml(t.name)+'</span></label>';
  }).join('');
}

function filterPredList(){
  renderPredList(document.getElementById('pred-search').value);
}

function togglePred(n,checked){
  if(checked&&!editPreds.includes(n))editPreds.push(n);
  else if(!checked)editPreds=editPreds.filter(p=>p!==n);
}

async function saveEditTask(){
  if(editTaskNum===null)return;
  const t=bn[editTaskNum];
  const dur=parseInt(document.getElementById('edit-dur').value);
  const lagRaw=document.getElementById('edit-lag').value;const lag=lagRaw!==''?parseInt(lagRaw):0;
  const phaseEl=document.getElementById('edit-phase');
  const newPhase=parseInt(phaseEl.value);
  const newPhaseName=phaseEl.options[phaseEl.selectedIndex].text;
  const estStartRaw=document.getElementById('edit-est-start').value.trim();
  const newEstStart=(estStartRaw&&isValidDate(estStartRaw))?estStartRaw:null;

  if(!dur||dur<1){alert('Duration must be at least 1 day.');return;}

  const btn=document.getElementById('edit-save-btn');
  btn.textContent='Saving…';btn.disabled=true;

  // Update in-memory task
  t.dur=dur;
  t.lag=lag;
  t.preds=[...editPreds];
  t.phase=newPhase;
  t.phase_name=newPhaseName;
  t.est_start_date=newEstStart;

  // Persist to DB
  await sbCall('editLotTask',{
    task_id:t._id,
    predecessors:editPreds,
    lag:lag,
    duration:dur,
    phase_name:newPhaseName,
    phase_order:newPhase
  });
  await sbCall('updateScheduleLotTask',{task_id:t._id,lot_id:curLot.id,est_start_date:newEstStart});

  btn.textContent='Save Changes';btn.disabled=false;
  closeEditTask();
  renderSchedule(); // recompute + re-render with updated task
}

let lotNotes=[],noteTaskNum=null,noteFlag='none';
function notesForTask(bt){return lotNotes.filter(n=>n.bt_num===bt).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));}
function fmtNoteTime(iso){const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function flagBadge(f){if(f==='red')return '<span style="font-size:13px">🔴</span>';if(f==='yellow')return '<span style="font-size:13px">🟡</span>';return '';}

function openNote(n){

function closeNote(){document.getElementById('notemodal').style.display='none';noteTaskNum=null;renderTasks();}
function setNoteFlag(f){noteFlag=f;renderFlagBtns();}
function renderFlagBtns(){document.querySelectorAll('#notemodal .flagbtn').forEach(b=>{b.classList.toggle('sel',b.dataset.f===noteFlag);});}

function renderThread(){
  const list=notesForTask(noteTaskNum);
  const el=document.getElementById('note-thread');
  if(!list.length){el.innerHTML='<div style="font-size:13px;color:var(--muted)">No notes yet.</div>';return;}

      +'<span style="font-size:11px;color:var(--muted);font-family:\'DM Mono\',monospace">'+fmtNoteTime(nt.created_at)+(nt.author?' · '+nt.author:'')+'</span>'

  }).join('');

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function aiCleanup(){
  const ta=document.getElementById('note-text');const raw=ta.value.trim();
  if(!raw){alert('Write a note first.');return;}
  const btn=document.getElementById('note-ai');const orig=btn.textContent;btn.textContent='☁️ Cleaning…';btn.disabled=true;
  try{
    const r=await fetch('/.netlify/functions/cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rawText:raw})});
    const d=await r.json();
    if(d.cleaned){ta.value=d.cleaned;}else{alert('Cleanup failed: '+(d.error||'unknown'));}
  }catch(e){alert('Cleanup error: '+e);}
  btn.textContent=orig;btn.disabled=false;
}

async function addNote(){
  if(noteTaskNum===null)return;
  const t=bn[noteTaskNum];
  const note=document.getElementById('note-text').value.trim();
  if(!note){alert('Write a note first.');return;}
  const res=await sbCall('addTaskNote',{lot_task_id:t._id,lot_id:curLot.id,bt_num:t.num,note:note,flag:noteFlag,author:currentBuilder});
  const row=Array.isArray(res)?res[0]:res;
  if(row&&row.id){lotNotes.push(row);}
  else{lotNotes.push({id:'tmp'+Date.now(),lot_task_id:t._id,lot_id:curLot.id,bt_num:t.num,note,flag:noteFlag,author:currentBuilder,created_at:new Date().toISOString()});}
  document.getElementById('note-text').value='';noteFlag='none';renderFlagBtns();
  renderThread();
}

async function cycleNoteFlag(id){
  const nt=lotNotes.find(x=>x.id===id);if(!nt)return;
  const order=['none','yellow','red'];nt.flag=order[(order.indexOf(nt.flag)+1)%3];
  renderThread();
  await sbCall('updateTaskNote',{id,flag:nt.flag});
}

// ===== BULK PUSH MODULE =====
// ============================================================
// BULK PUSH — push a task's status (+ optional note) from the current lot
// to other ACTIVE lots in the SAME subdivision. Built for the real
// "Ashland Field" scheduling app: reuses sbCall / updateScheduleLotTask /
// addTaskNote. No backend changes. Writes go wherever the app already writes
// (dev_ tables on the dev site, live tables on live).
//
// Modes:
//   Single task push  -> openBulkPushTask(btNum)
//   Whole-lot push    -> openBulkPushLot()
// Both show a target picker, then a preview, then apply. No undo (v1).
// ============================================================

let _bpMode = 'task';      // 'task' | 'lot'
let _bpBtNum = null;       // for single-task mode
let _bpTargets = [];       // [{id, lot_number, community}]
let _bpSelected = {};      // {lotId: true}
let _bpIncludeNote = false;
let _bpNoteText = '';
let _bpNoteFlag = 'none';

// candidate lots: same subdivision as curLot, active (not closed), not curLot
function _bpCandidateLots(){
  if(!curLot) return [];
  const sub = curLot.community;
  return (myLots||[]).filter(l =>
    l.id !== curLot.id &&
    l.community === sub &&
    l.status !== 'closed'
  ).sort((a,b)=>(a.lot_number||'').localeCompare(b.lot_number||'',undefined,{numeric:true}));
}

// ---- entry points ----
function openBulkPushTask(btNum){
  if(!curLot){alert('Open a lot first.');return;}
  const cand=_bpCandidateLots();
  if(!cand.length){alert('No other active lots in '+(SUB_NAMES[curLot.community]||curLot.community)+' to push to.');return;}
  _bpMode='task'; _bpBtNum=btNum; _bpTargets=cand; _bpSelected={};
  _bpIncludeNote=false; _bpNoteText=''; _bpNoteFlag='none';
  _bpRenderPicker();
}
function openBulkPushLot(){
  if(!curLot){alert('Open a lot first.');return;}
  const cand=_bpCandidateLots();
  if(!cand.length){alert('No other active lots in '+(SUB_NAMES[curLot.community]||curLot.community)+' to push to.');return;}
  _bpMode='lot'; _bpBtNum=null; _bpTargets=cand; _bpSelected={};
  _bpIncludeNote=false; _bpNoteText=''; _bpNoteFlag='none';
  _bpRenderPicker();
}

function _bpClose(){const o=document.getElementById('bp-overlay');if(o)o.remove();}

// ---- step 1: target picker ----
function _bpRenderPicker(){
  _bpClose();
  const subName=SUB_NAMES[curLot.community]||curLot.community;
  let title, sub;
  if(_bpMode==='task'){
    const t=bn[_bpBtNum];
    const a=act[_bpBtNum]||{};
    const statusTxt=a.finished?'Finished':(a.started?'Started':'Not started');
    title='Push Task #'+_bpBtNum+' — '+(t?t.name:'');
    sub='Status: '+statusTxt+(a.start?'  ·  start '+fmt(new Date(a.start+'T00:00:00')):'')+(a.finish?'  ·  finish '+fmt(new Date(a.finish+'T00:00:00')):'');
  } else {
    const done=TASKS.filter(t=>act[t.num]&&act[t.num].finished).length;
    const started=TASKS.filter(t=>act[t.num]&&act[t.num].started&&!act[t.num].finished).length;
    title='Push Entire Lot Status — '+curLot.lot_number;
    sub=done+' finished, '+started+' started across '+TASKS.length+' tasks';
  }
  let rows=_bpTargets.map(l=>{
    const checked=_bpSelected[l.id]?'checked':'';
    return '<label class="bp-lot"><input type="checkbox" data-id="'+l.id+'" '+checked+'><span class="bp-lotnum">'+l.lot_number+'</span><span class="bp-lotstage">stage '+(l.reported_stage||'—')+'</span></label>';
  }).join('');

  const noteBlock = _bpMode==='task' ? (
    '<div class="bp-note-wrap">'
    +'<label class="bp-note-toggle"><input type="checkbox" id="bp-note-on" '+(_bpIncludeNote?'checked':'')+'> Also push a note to these lots</label>'
    +'<div id="bp-note-fields" style="display:'+(_bpIncludeNote?'block':'none')+'">'
    +'<textarea id="bp-note-text" placeholder="Note text (applied to task #'+_bpBtNum+' on each selected lot)">'+(_bpNoteText||'')+'</textarea>'
    +'<div class="bp-flags">'
    +'<button type="button" class="bp-flag'+(_bpNoteFlag==='none'?' on':'')+'" data-flag="none">No flag</button>'
    +'<button type="button" class="bp-flag'+(_bpNoteFlag==='yellow'?' on':'')+'" data-flag="yellow">🟡 Yellow</button>'
    +'<button type="button" class="bp-flag'+(_bpNoteFlag==='red'?' on':'')+'" data-flag="red">🔴 Red</button>'
    +'</div></div></div>'
  ) : '';

  const html=''
    +'<div id="bp-overlay" class="bp-overlay"><div class="bp-modal">'
    +'<div class="bp-head"><div class="bp-title">'+title+'</div><button class="bp-x" onclick="_bpClose()">✕</button></div>'
    +'<div class="bp-subtitle">'+sub+'</div>'
    +'<div class="bp-section-label">Push to these lots in '+subName+':</div>'
    +'<div class="bp-select-row"><button type="button" class="bp-selall" onclick="_bpSelectAll(true)">Select all</button><button type="button" class="bp-selall" onclick="_bpSelectAll(false)">Clear</button></div>'
    +'<div class="bp-lots">'+rows+'</div>'
    +noteBlock
    +'<div class="bp-foot"><button class="bp-cancel" onclick="_bpClose()">Cancel</button><button class="bp-next" onclick="_bpToPreview()">Preview →</button></div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);

  // wire checkboxes
  document.querySelectorAll('#bp-overlay .bp-lot input').forEach(cb=>{
    cb.onchange=()=>{ _bpSelected[cb.dataset.id]=cb.checked; };
  });
  const noteOn=document.getElementById('bp-note-on');
  if(noteOn){
    noteOn.onchange=()=>{ _bpIncludeNote=noteOn.checked; document.getElementById('bp-note-fields').style.display=_bpIncludeNote?'block':'none'; };
  }
  const nt=document.getElementById('bp-note-text');
  if(nt){ nt.oninput=()=>{_bpNoteText=nt.value;}; }
  document.querySelectorAll('#bp-overlay .bp-flag').forEach(b=>{
    b.onclick=()=>{ _bpNoteFlag=b.dataset.flag; document.querySelectorAll('#bp-overlay .bp-flag').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  });
}

function _bpSelectAll(v){
  _bpTargets.forEach(l=>_bpSelected[l.id]=v);
  document.querySelectorAll('#bp-overlay .bp-lot input').forEach(cb=>cb.checked=v);
}

// ---- step 2: preview ----
function _bpToPreview(){
  const chosen=_bpTargets.filter(l=>_bpSelected[l.id]);
  if(!chosen.length){alert('Select at least one lot.');return;}
  if(_bpIncludeNote && _bpMode==='task' && !(_bpNoteText||'').trim()){alert('You turned on note push but the note is empty.');return;}

  let what;
  if(_bpMode==='task'){
    const t=bn[_bpBtNum]; const a=act[_bpBtNum]||{};
    const statusTxt=a.finished?'FINISHED':(a.started?'STARTED':'NOT STARTED');
    what='<div class="bp-pv-line"><b>Task #'+_bpBtNum+'</b> — '+(t?t.name:'')+'</div>'
      +'<div class="bp-pv-line">Set to <b>'+statusTxt+'</b>'
      +(a.start?' · start '+fmt(new Date(a.start+'T00:00:00')):'')
      +(a.finish?' · finish '+fmt(new Date(a.finish+'T00:00:00')):'')+'</div>'
      +(_bpIncludeNote?'<div class="bp-pv-line">+ note ('+(_bpNoteFlag==='none'?'no flag':_bpNoteFlag)+'): "'+_bpNoteText.replace(/</g,'&lt;')+'"</div>':'');
  } else {
    const done=TASKS.filter(t=>act[t.num]&&act[t.num].finished).length;
    const started=TASKS.filter(t=>act[t.num]&&act[t.num].started&&!act[t.num].finished).length;
    what='<div class="bp-pv-line">Copy <b>all task statuses</b> from '+curLot.lot_number+'</div>'
      +'<div class="bp-pv-line">'+done+' finished · '+started+' started · with their actual dates</div>'
      +'<div class="bp-pv-warn">⚠ This overwrites task status on the target lots. Tasks further along on a target may be pulled back to match this lot.</div>';
  }
  const lotList=chosen.map(l=>l.lot_number).join(', ');
  const html=''
    +'<div id="bp-overlay" class="bp-overlay"><div class="bp-modal">'
    +'<div class="bp-head"><div class="bp-title">Confirm push</div><button class="bp-x" onclick="_bpClose()">✕</button></div>'
    +'<div class="bp-pv">'+what+'</div>'
    +'<div class="bp-section-label">To '+chosen.length+' lot'+(chosen.length===1?'':'s')+':</div>'
    +'<div class="bp-pv-lots">'+lotList+'</div>'
    +'<div class="bp-foot"><button class="bp-cancel" onclick="_bpRenderPicker()">← Back</button><button class="bp-apply" onclick="_bpApply()">Apply to '+chosen.length+' lot'+(chosen.length===1?'':'s')+'</button></div>'
    +'</div></div>';
  _bpClose();
  document.body.insertAdjacentHTML('beforeend',html);
}

// ---- step 3: apply ----
function _bpProgressScreen(total){
  _bpClose();
  const html=''
    +'<div id="bp-overlay" class="bp-overlay"><div class="bp-modal">'
    +'<div class="bp-head"><div class="bp-title">Applying push…</div></div>'
    +'<div class="bp-subtitle" id="bp-prog-label">Starting…</div>'
    +'<div class="bp-progbar"><div class="bp-progfill" id="bp-progfill" style="width:0%"></div></div>'
    +'<div class="bp-prog-detail" id="bp-prog-detail"></div>'
    +'<div class="bp-prog-warn">Please keep this screen open until it finishes.</div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function _bpProgress(lotIdx, lotTotal, lotLabel, taskDone, taskTotal){
  const pct=Math.round((lotIdx/lotTotal)*100);
  const lbl=document.getElementById('bp-prog-label');
  const fill=document.getElementById('bp-progfill');
  const det=document.getElementById('bp-prog-detail');
  if(lbl) lbl.textContent='Lot '+lotIdx+' of '+lotTotal+'  ('+lotLabel+')';
  if(fill) fill.style.width=pct+'%';
  if(det) det.textContent=(taskTotal>1)?('task '+taskDone+' / '+taskTotal):'';
}

async function _bpApply(){
  const chosen=_bpTargets.filter(l=>_bpSelected[l.id]);
  _bpProgressScreen(chosen.length);

  let ok=0, fail=0; const errors=[];
  const doneLots=[], failedLots=[];
  let lotIdx=0;

  for(const lot of chosen){
    lotIdx++;
    let lotHadError=false;
    _bpProgress(lotIdx, chosen.length, lot.lot_number, 0, 1);
    try{
      // fetch this target lot's own task rows (its own task_ids per bt_num)
      const data=await sbCall('getScheduleLotTasks',{lot_id:lot.id});
      const rows=(data&&data.tasks)||[];
      const gates=(data&&data.gates)||[];
      const byNum={}; rows.forEach(r=>byNum[r.bt_num]=r);

      // local act-map for this TARGET lot, starting from its current state,
      // then overwritten by whatever we push. Used to compute the target's stage.
      const tgtAct={};
      rows.forEach(r=>{ tgtAct[r.bt_num]={started:(r.status==='started'||r.status==='finished'),finished:(r.status==='finished'),start:r.actual_start,finish:r.actual_finish}; });

      const pushOne=async(btNum)=>{
        const src=act[btNum]; if(!src) return;
        const tgt=byNum[btNum];
        if(!tgt){ errors.push(lot.lot_number+': task #'+btNum+' not found'); fail++; lotHadError=true; return; }
        const status=src.finished?'finished':(src.started?'started':'not_started');
        await sbCall('updateScheduleLotTask',{
          task_id:tgt.id, lot_id:lot.id,
          status:status,
          actual_start:src.start||null,
          actual_finish:src.finish||null
        });
        tgtAct[btNum]={started:!!src.started||!!src.finished,finished:!!src.finished,start:src.start||null,finish:src.finish||null};
        ok++;
      };

      if(_bpMode==='task'){
        await pushOne(_bpBtNum);
        if(_bpIncludeNote && (_bpNoteText||'').trim()){
          const tgt=byNum[_bpBtNum];
          if(tgt){
            await sbCall('addTaskNote',{
              lot_task_id:tgt.id, lot_id:lot.id, bt_num:_bpBtNum,
              note:_bpNoteText.trim()+'  (pushed from '+curLot.lot_number+')',
              flag:_bpNoteFlag, author:currentBuilder
            });
          }
        }
      } else {
        const pushable=TASKS.filter(t=>act[t.num]);
        let ti=0;
        for(const t of pushable){ ti++; await pushOne(t.num); _bpProgress(lotIdx, chosen.length, lot.lot_number, ti, pushable.length); }
      }

      // ---- recompute this target lot's stage from its NEW task set ----
      // mirrors computeStage(): highest-order non-manual stage whose triggers are all finished,
      // held to 5.9 if any utility gate is open and true stage > 5.9.
      let sm=[];
      if(lot.template_id){ const r=await sbCall('getTemplateStageMap',{template_id:lot.template_id}); sm=(r&&r.stages)||[]; }
      let trueStage=null;
      sm.filter(s=>!s.is_manual&&s.triggers&&s.triggers.length&&s.triggers.every(bt=>tgtAct[bt]&&tgtAct[bt].finished))
        .forEach(s=>{ if(!trueStage||s.order>trueStage.order) trueStage=s; });
      const gatesOpen=gates.some(g=>!g.confirmed);
      let reportedCode, trueCode=trueStage?trueStage.code:null;
      if(trueStage&&gatesOpen&&parseFloat(trueStage.code)>5.9){ reportedCode='5.9'; }
      else { reportedCode=trueStage?trueStage.code:null; }
      await sbCall('updateScheduleLot',{id:lot.id,reported_stage:reportedCode,true_stage:trueCode});
      if(lotHadError) failedLots.push(lot.lot_number); else doneLots.push(lot.lot_number);
    }catch(e){
      fail++; lotHadError=true; failedLots.push(lot.lot_number);
      errors.push(lot.lot_number+': '+(e&&e.message?e.message:'error'));
    }
  }

  _bpClose();
  let msg=doneLots.length+' of '+chosen.length+' lots updated.';
  if(doneLots.length) msg+='\n\n✓ Done: '+doneLots.join(', ');
  if(failedLots.length) msg+='\n\n✗ Not completed: '+failedLots.join(', ')+'\n(re-run the push for just these lots)';
  alert(msg);

  // refresh current view so the user sees a clean state
  if(typeof loadMyLots==='function'){ await loadMyLots(); }
}

</script>
