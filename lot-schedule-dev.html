<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Schedule — Ashland (DEV)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#00A9D1;--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--crit:#c0392b;--done:#1E8449;--start:#2563eb;--bg:#f3f4f6}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:60px}
.devbanner{position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.15em;padding:6px;pointer-events:none}
.wrap{max-width:900px;margin:0 auto;padding:44px 16px 0}
.controls{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls label{font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
select{font-family:'Instrument Sans',sans-serif;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:220px}
.topbar{background:var(--ink);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.topbar .item{display:flex;flex-direction:column}
.topbar .k{font-size:10px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5)}
.topbar .v{font-size:18px;font-weight:700;font-family:'DM Mono',monospace}
.topbar .sublbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}
.gatebar{background:#fff6ee;border:1px solid #f7d774;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.gatebar .gh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--crit);margin-bottom:8px}
.gatebar .grow{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.gbtn.on{background:var(--done);color:#fff;border-color:var(--done)}
.notice{background:#fef9e7;border:1px solid #f7d774;color:#7d6608;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.ph{background:var(--ink);color:#fff;padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:.03em;display:flex;justify-content:space-between;cursor:pointer;user-select:none;border-radius:8px;margin-top:8px}
.ph:hover{background:#2a2a2a}
.ph-count{font-weight:500;opacity:.6;font-size:10px}
.active-badge{background:var(--done);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:.05em}
.pd{font-family:'DM Mono',monospace;font-weight:500;opacity:.8}
.t{background:var(--paper);border:1px solid var(--line);border-top:none;padding:10px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.t.done{background:#f6fbf7}
.t.started{background:#f5f9ff}
.tname{font-size:13px;font-weight:600}
.tnum{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);background:var(--line);padding:1px 5px;border-radius:4px;margin-right:2px}
.ttags{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:8px;font-weight:700;text-transform:uppercase;padding:2px 5px;border-radius:3px}
.tag.crit{background:#fbe6e4;color:var(--crit)}.tag.float{background:#eef0f2;color:var(--muted)}.tag.action{background:#fbeee0;color:#c47d2e}
.tag.st{background:#eafaf1;color:var(--done)}
.tdates{font-size:12px;font-family:'DM Mono',monospace;text-align:right;white-space:nowrap}
.tdates b{color:var(--ink)}
.tdates .plan{color:var(--muted);font-size:11px}
.tright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tctrl{display:flex;gap:5px}
.ab{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:6px;border:none;cursor:pointer}
.ab.start{background:var(--start);color:#fff}
.ab.fin{background:var(--done);color:#fff}
.ab.undo{background:#eef0f2;color:var(--muted)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px}
</style>
</head>
<body>
<div class="devbanner">⚠ DEVELOPMENT / UAT — NOT FOR BUILDER USE ⚠</div>
<div class="wrap">
  <div class="controls">
    <label>Schedule Lot</label>
    <select id="lotpick"><option value="">Loading lots…</option></select>
  </div>
  <div id="view"><div class="empty">Pick a lot to view its computed schedule.</div></div>
</div>

<script>
const SUPABASE_FN='/.netlify/functions/supabase';
let API_SECRET=null;
async function loadSecret(){if(API_SECRET)return API_SECRET;const r=await fetch('/.netlify/functions/config');const d=await r.json();API_SECRET=d.secret;return API_SECRET;}
async function sbCall(action,payload){await loadSecret();const r=await fetch(SUPABASE_FN,{method:'POST',headers:{'Content-Type':'application/json','X-Api-Secret':API_SECRET},body:JSON.stringify({action,payload})});const d=await r.json();if(d&&d.error){alert('Error: '+d.error);return null;}return d;}

// ===== ENGINE STATE =====
let TASKS=[], bn={}, act={}, startDate=null;
let collapsedPhases={}, userToggledPhases=false;
let currentLotId=null, currentTemplateId=null;
let stageMap=[], lotGates=[];

// ===== CALENDAR HELPERS (from validated harness) =====
function addWD(start,off){let d=new Date(start);d.setHours(0,0,0,0);let c=1;while(c<off){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)c++;}return d;}
function wdBetween(a,b){let d1=new Date(a),d2=new Date(b);d1.setHours(0,0,0,0);d2.setHours(0,0,0,0);if(d1.getTime()===d2.getTime())return 0;const sign=d2>d1?1:-1;let cur=new Date(d1),c=0;while(cur.getTime()!==d2.getTime()){cur.setDate(cur.getDate()+sign);const w=cur.getDay();if(w!==0&&w!==6)c+=sign;}return c;}
function fmt(d){return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function actOffset(iso){if(!startDate||!iso)return null;return wdBetween(startDate,new Date(iso+'T00:00:00'))+1;}
function offToDate(off){if(off>=1)return addWD(startDate,off);let d=new Date(startDate);d.setHours(0,0,0,0);let c=1;while(c>off){d.setDate(d.getDate()-1);const w=d.getDay();if(w!==0&&w!==6)c--;}return d;}

function runEngine(mode){
  const memo={};
  function ef(n,stk){
    if(memo[n]!==undefined)return memo[n];
    const t=bn[n];if(stk.includes(n))return t.rf||1;
    let pd=null;
    (t.preds||[]).forEach(p=>{if(bn[p]){const pe=ef(p,[...stk,n]);pd=(pd===null)?pe+1:Math.max(pd,pe+1);}});
    let es;const a=act[n]||{};
    const aStartOff=(mode==='projected'&&a.started&&a.start)?actOffset(a.start):null;
    if(aStartOff!==null){es=aStartOff;}
    else{const ps=(pd!==null)?pd+t.lag:null;const c=[];if(t.rs!==null&&t.rs!==undefined)c.push(t.rs);if(ps!==null)c.push(ps);es=c.length?Math.max(...c):(t.rs||1);}
    let e;const aFinOff=(mode==='projected'&&a.finished&&a.finish)?actOffset(a.finish):null;
    if(aFinOff!==null){e=aFinOff;}else{e=es+t.dur-1;}
    memo[n]=e;t['_'+mode+'_es']=es;t['_'+mode+'_ef']=e;return e;
  }
  TASKS.forEach(t=>ef(t.num,[]));
  const end=Math.max(...TASKS.map(t=>t['_'+mode+'_ef']));
  if(mode==='planned'){
    const succ={};TASKS.forEach(t=>succ[t.num]=[]);
    TASKS.forEach(t=>(t.preds||[]).forEach(p=>{if(succ[p])succ[p].push(t.num)}));
    const lf={};
    function latef(n,stk){if(lf[n]!==undefined)return lf[n];if(stk.includes(n))return end;const ss=succ[n];let v=ss.length===0?end:Math.min(...ss.map(s=>latef(s,[...stk,n])-bn[s].dur+1-1-bn[s].lag));lf[n]=v;return v;}
    TASKS.forEach(t=>{t._lf=latef(t.num,[]);t._ls=t._lf-t.dur+1;t._tf=t._ls-t._planned_es;t._crit=(t._tf<=0)});
  }
  return end;
}
function recompute(){const p=runEngine('planned');const pr=runEngine('projected');return {planEnd:p,projEnd:pr};}

// ===== STAGE (cap-and-snap Option B) =====
function computeStage(){
  // achieved auto stages: every trigger task finished (AND logic)
  const achieved=stageMap.filter(s=>!s.is_manual && s.triggers && s.triggers.length && s.triggers.every(bt=>act[bt]&&act[bt].finished));
  let trueStage=null;
  achieved.forEach(s=>{if(!trueStage||s.order>trueStage.order)trueStage=s;});
  const gatesOpen=lotGates.some(g=>!g.confirmed);
  const HOLD=5.9;
  let held=false, reportedCode, reportedLabel;
  if(trueStage && gatesOpen && parseFloat(trueStage.code)>HOLD){
    held=true; reportedCode='5.9'; reportedLabel='Utility Hold';
  } else {
    reportedCode=trueStage?trueStage.code:'—';
    reportedLabel=trueStage?trueStage.label:'Pre-construction';
  }
  return {reportedCode,reportedLabel,held,trueCode:trueStage?trueStage.code:null,trueLabel:trueStage?trueStage.label:null,gatesOpen};
}

// ===== LOAD LOTS INTO PICKER =====
async function initPicker(){
  const lots=await sbCall('getScheduleLots',{})||[];
  const sel=document.getElementById('lotpick');
  if(!lots.length){sel.innerHTML='<option value="">No stamped lots yet</option>';return;}
  sel.innerHTML='<option value="">Select a lot…</option>'+lots.map(l=>{
    const label=l.lot_number+(l.community?' · '+l.community:'')+(l.construction_start_date?'':' (no start date)');
    return '<option value="'+l.id+'" data-start="'+(l.construction_start_date||'')+'" data-num="'+encodeURIComponent(l.lot_number)+'" data-tpl="'+(l.template_id||'')+'">'+label+'</option>';
  }).join('');
  sel.onchange=()=>{const o=sel.options[sel.selectedIndex];if(!sel.value){document.getElementById('view').innerHTML='<div class="empty">Pick a lot to view its computed schedule.</div>';return;}loadLot(sel.value,o.dataset.start,decodeURIComponent(o.dataset.num),o.dataset.tpl);};
}

// ===== LOAD A LOT + RUN ENGINE =====
async function loadLot(lotId,startIso,lotNum,tplId){
  document.getElementById('view').innerHTML='<div class="loading">Loading schedule…</div>';
  const data=await sbCall('getScheduleLotTasks',{lot_id:lotId});
  if(!data){return;}
  const rows=data.tasks||[];
  if(!rows.length){document.getElementById('view').innerHTML='<div class="empty">This lot has no tasks.</div>';return;}
  lotGates=data.gates||[];
  // stage map from the template
  if(tplId){const sm=await sbCall('getTemplateStageMap',{template_id:tplId});stageMap=(sm&&sm.stages)||[];}else{stageMap=[];}

  // map Supabase rows -> engine shape
  TASKS=rows.map(r=>({
    _id:r.id, num:r.bt_num, name:r.name, rs:r.relative_start, dur:r.duration, lag:r.lag,
    rf:r.relative_finish, preds:r.predecessors||[], phase:r.phase_order,
    phase_name:r.phase_name, type:r.task_type
  }));
  bn={};TASKS.forEach(t=>bn[t.num]=t);
  currentLotId=lotId;
  // actuals from DB status
  act={};rows.forEach(r=>{act[r.bt_num]={started:(r.status==='started'||r.status==='finished'),finished:(r.status==='finished'),start:r.actual_start,finish:r.actual_finish};});

  // start date (or today preview)
  let noStart=false;
  if(startIso){startDate=new Date(startIso+'T00:00:00');}else{startDate=new Date();startDate.setHours(0,0,0,0);noStart=true;}

  userToggledPhases=false;collapsedPhases={};
  render(lotNum,noStart);
}

function render(lotNum,noStart){
  lastLotNum=lotNum; lastNoStart=noStart;
  const {planEnd,projEnd}=recompute();
  const finDate=offToDate(projEnd);
  const st=computeStage();
  let h='';
  h+='<div class="topbar">'
    +'<div class="item"><span class="k">Lot</span><span class="v">'+lotNum+'</span></div>'
    +'<div class="item"><span class="k">Reported Stage</span><span class="v">'+st.reportedCode+'</span><span class="sublbl">'+st.reportedLabel+'</span></div>'
    +'<div class="item"><span class="k">Start</span><span class="v">'+fmt(startDate)+'</span></div>'
    +'<div class="item"><span class="k">Projected Finish</span><span class="v">'+fmt(finDate)+'</span></div>'
    +'<div class="item"><span class="k">Working Days</span><span class="v">'+projEnd+'</span></div>'
    +'</div>';
  // gate bar
  if(lotGates.length){
    let gb='<div class="gatebar"><div class="gh">'+(st.held?'⚡ HELD at 5.9 — actually Stage '+st.trueCode+' ('+st.trueLabel+')':(st.gatesOpen?'Utility Confirmations — required to clear Stage 5.9':'✓ All utilities confirmed'))+'</div><div class="grow">';
    lotGates.forEach(g=>{gb+='<button class="gbtn'+(g.confirmed?' on':'')+'" data-gid="'+g.id+'" data-cf="'+(g.confirmed?1:0)+'">'+g.gate_name+(g.confirmed?' ✓':'')+'</button>';});
    gb+='</div></div>';
    h_gate=gb;
  } else { h_gate=''; }
  document.getElementById('view').innerHTML=h+(noStart?'<div class="notice">No construction start date set for this lot — showing a preview from <b>today</b>. Set the start date in the admin Schedule Lots tab for real dates.</div>':'')+h_gate+'<div id="sched"></div>';
  renderSched();
  document.querySelectorAll('.gbtn').forEach(b=>{b.onclick=()=>toggleGate(b.dataset.gid, b.dataset.cf==='1');});
}
let h_gate='';

async function toggleGate(gateId, currentlyConfirmed){
  const g=lotGates.find(x=>x.id===gateId); if(!g)return;
  g.confirmed=!currentlyConfirmed;
  render(lastLotNum,lastNoStart);
  await sbCall('updateScheduleLotGate',{gate_id:gateId,confirmed:g.confirmed});
  await saveStage();
}
let lastLotNum='', lastNoStart=false;

function renderSched(){
  let h='';
  const phaseOrder=[];const seen={};
  TASKS.forEach(t=>{if(!seen[t.phase]){seen[t.phase]=true;phaseOrder.push(t.phase);}});
  phaseOrder.sort((a,b)=>a-b);
  const phaseName={};TASKS.forEach(t=>phaseName[t.phase]=t.phase_name);
  // active phase = earliest unfinished task's phase
  let activePhase=null,earliest=Infinity;
  TASKS.forEach(t=>{if(!(act[t.num]&&act[t.num].finished)&&t._projected_es<earliest){earliest=t._projected_es;activePhase=t.phase;}});
  if(!userToggledPhases){phaseOrder.forEach(ph=>{collapsedPhases[ph]=(ph!==activePhase);});}

  phaseOrder.forEach(ph=>{
    const inPhase=TASKS.filter(t=>t.phase===ph);
    if(!inPhase.length)return;
    inPhase.sort((a,b)=>(a._projected_es-b._projected_es)||(a.num-b.num));
    const pd=fmt(offToDate(Math.min(...inPhase.map(x=>x._projected_es))))+' – '+fmt(offToDate(Math.max(...inPhase.map(x=>x._projected_ef))));
    const collapsed=collapsedPhases[ph];
    const doneCt=inPhase.filter(t=>act[t.num]&&act[t.num].finished).length;
    const caret=collapsed?'▸':'▾';
    const activeTag=(ph===activePhase)?' <span class="active-badge">active</span>':'';
    h+='<div class="ph" data-ph="'+ph+'"><span>'+caret+' '+(phaseName[ph]||('Phase '+ph))+activeTag+' <span class="ph-count">('+doneCt+'/'+inPhase.length+')</span></span><span class="pd">'+pd+'</span></div>';
    if(collapsed)return;
    inPhase.forEach(t=>{
      const a=act[t.num]||{};
      const cls=a.finished?'done':(a.started?'started':'');
      const ps=offToDate(t._projected_es),pf=offToDate(t._projected_ef);
      let dates='<b>'+fmt(ps)+' → '+fmt(pf)+'</b>';
      const stTag=a.finished?'<span class="tag st">done</span>':(a.started?'<span class="tag st">started</span>':'');
      const critTag=t._crit?'<span class="tag crit">critical</span>':'<span class="tag float">float '+t._tf+'d</span>';
      const actionTag=t.type==='action'?'<span class="tag action">action</span>':'';
      let ctrl='';
      if(a.finished){ctrl='<button class="ab undo" data-act="undo" data-n="'+t.num+'">undo</button>';}
      else if(a.started){ctrl='<button class="ab fin" data-act="finish" data-n="'+t.num+'">finish</button><button class="ab undo" data-act="undo" data-n="'+t.num+'">undo</button>';}
      else{ctrl='<button class="ab start" data-act="start" data-n="'+t.num+'">start</button>';}
      h+='<div class="t '+cls+'"><div style="flex:1"><div class="tname"><span class="tnum">#'+t.num+'</span> '+t.name+'</div>'
        +'<div class="ttags">'+critTag+actionTag+stTag+'</div></div>'
        +'<div class="tright"><div class="tdates">'+dates+'</div><div class="tctrl">'+ctrl+'</div></div></div>';
    });
  });
  document.getElementById('sched').innerHTML=h;
  document.querySelectorAll('.ph').forEach(el=>{el.onclick=()=>{const p=+el.dataset.ph;userToggledPhases=true;collapsedPhases[p]=!collapsedPhases[p];renderSched();};});
  document.querySelectorAll('.ab').forEach(b=>{b.onclick=e=>{e.stopPropagation();const n=+b.dataset.n,ac=b.dataset.act;if(ac==='start')startTask(n);else if(ac==='finish')finishTask(n);else if(ac==='undo')undoTask(n);};});
}

function ymd(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function isValidDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00').getTime());}

async function saveTask(t){
  const a=act[t.num];
  await sbCall('updateScheduleLotTask',{task_id:t._id,lot_id:currentLotId,status:(a.finished?'finished':(a.started?'started':'not_started')),actual_start:a.start||null,actual_finish:a.finish||null});
  await saveStage();
}

async function saveStage(){
  if(!currentLotId)return;
  const st=computeStage();
  await sbCall('updateScheduleLot',{id:currentLotId,reported_stage:(st.reportedCode==='—'?null:st.reportedCode),true_stage:st.trueCode||null});
}

async function startTask(n){
  const t=bn[n];const def=ymd(offToDate(t._projected_es));
  const v=prompt('Start date for #'+n+' '+t.name+' (YYYY-MM-DD):',def);
  if(v===null)return;if(!isValidDate(v)){alert('Invalid date. Use YYYY-MM-DD.');return;}
  act[n]={started:true,finished:false,start:v,finish:null};
  render(lastLotNum,lastNoStart);await saveTask(t);
}

async function finishTask(n){
  const t=bn[n];const def=ymd(offToDate(t._projected_ef));
  const v=prompt('Finish date for #'+n+' '+t.name+' (YYYY-MM-DD):',def);
  if(v===null)return;if(!isValidDate(v)){alert('Invalid date. Use YYYY-MM-DD.');return;}
  const a=act[n]||{};act[n]={started:true,finished:true,start:a.start||v,finish:v};
  render(lastLotNum,lastNoStart);await saveTask(t);
}

async function undoTask(n){
  const t=bn[n];act[n]={started:false,finished:false,start:null,finish:null};
  render(lastLotNum,lastNoStart);await saveTask(t);
}

initPicker();
</script>
</body>
</html>
